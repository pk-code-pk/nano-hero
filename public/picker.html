<div id=bar>
<textarea id=out readonly placeholder="click the seal pieces (ring + tomoe) — ids show up here"></textarea>
<button id=copy>Copy ids</button>
</div>
<script>
const sel=new Set();
document.querySelectorAll('path').forEach(p=>p.addEventListener('click',()=>{
  const id=p.dataset.id;
  if(sel.has(id)){sel.delete(id);p.classList.remove('sel')}else{sel.add(id);p.classList.add('sel')}
  out.value=[...sel].join(',');
}));
copy.addEventListener('click',()=>navigator.clipboard.writeText(out.value));
</script>
